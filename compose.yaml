services:
  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      SERVER_PORT: 8081
    ports:
      - "8081:8081"

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    environment:
      SERVER_PORT: 8082
    ports:
      - "8082:8082"

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    environment:
      SERVER_PORT: 8080
      INVENTORY_SERVICE_URL: http://inventory-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8082
    depends_on:
      - inventory-service
      - payment-service
    ports:
      - "8080:8080"
